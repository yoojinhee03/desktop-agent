packages:
  - "packages/*"
  - "apps/*"
  - "eval"

# 빌드 스크립트 실행을 허용할 의존성만 명시한다 (pnpm 기본값은 전부 차단)
allowBuilds:
  esbuild: true

# pnpm 12의 최소 공개 기간 정책 예외: Agent SDK 0.3.322가 공개 직후라 설치 시 pnpm이 자동 추가함.
# SDK를 공개 기간이 지난 버전으로 올리면 이 목록을 지운다.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk@0.3.322"
